<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUCID</title>

  <!-- Google Fonts: Instrument Serif (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    /* ── RESET & BASE ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Color tokens — edit these to retheme the whole app */
      --bg:          #0f0f10;        /* page background (dark) */
      --surface:     #1a1a1d;        /* card / panel background */
      --surface-2:   #242428;        /* slightly lighter surface */
      --border:      rgba(255,255,255,0.08);
      --border-2:    rgba(255,255,255,0.14);
      --text:        #f0ede8;        /* primary text */
      --text-2:      #9a9690;        /* muted text */
      --text-3:      #5c5956;        /* very muted text */
      --accent:      #e8472a;        /* YouTube-ish red accent */
      --accent-2:    #f5a623;        /* warm amber for highlights */
      --success:     #3ecf8e;
      --danger:      #f04444;

      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;

      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;

      --transition:  0.18s ease;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      line-height: 1.6;
    }

    /* ── LAYOUT ───────────────────────────────────────────── */
    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── HEADER ───────────────────────────────────────────── */
    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text);
    }

    .tagline {
      font-size: 0.875rem;
      color: var(--text-2);
    }

    /* ── INPUT SECTION ────────────────────────────────────── */
    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .url-row {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.65rem 1rem;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition);
    }

    .url-input::placeholder { color: var(--text-3); }

    .url-input:focus {
      border-color: var(--border-2);
      box-shadow: 0 0 0 3px rgba(232,71,42,0.15);
    }

    /* Primary action button */
    .btn-primary {
      padding: 0.65rem 1.25rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity var(--transition), transform var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary:hover  { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Ghost/secondary button */
    .btn-ghost {
      padding: 0.5rem 1rem;
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-2);
    }

    /* Focus mode chips */
    .mode-row {
      display: flex;
      gap: 6px;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .mode-label {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-right: 2px;
    }

    .chip {
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      color: var(--text-2);
      background: transparent;
      cursor: pointer;
      transition: all var(--transition);
    }

    .chip:hover  { border-color: var(--border-2); color: var(--text); }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ── STATUS BAR ───────────────────────────────────────── */
    .status-bar {
      display: none; /* shown via JS */
      align-items: center;
      gap: 10px;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      color: var(--text-2);
      margin-bottom: 1rem;
    }

    .status-bar.visible { display: flex; }

    /* CSS-only spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR BOX ────────────────────────────────────────── */
    .error-box {
      display: none; /* shown via JS */
      background: rgba(240,68,68,0.08);
      border: 1px solid rgba(240,68,68,0.25);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #f87171;
      margin-bottom: 1rem;
    }

    .error-box.visible { display: block; }

    /* ── RESULT CARD ──────────────────────────────────────── */
    .result-card {
      display: none; /* shown via JS */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      animation: fadeUp 0.3s ease;
    }

    .result-card.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Video info strip at the top */
    .video-header {
      display: flex;
      gap: 14px;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .video-thumb {
      width: 96px;
      height: 64px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .video-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      line-height: 1.35;
      color: var(--text);
    }

    .video-author {
      font-size: 0.8125rem;
      color: var(--text-2);
      margin-top: 4px;
    }

    /* ── TABS ─────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      gap: 4px;
    }

    .tab-btn {
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font-body);
      font-size: 0.875rem;
      color: var(--text-2);
      cursor: pointer;
      margin-bottom: -1px; /* overlap the border */
      transition: color var(--transition), border-color var(--transition);
    }

    .tab-btn:hover   { color: var(--text); }
    .tab-btn.active  {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }

    /* Tab panels — only .active is shown */
    .tab-panel {
      display: none;
      padding: 1.5rem;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .panel-label {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 0.875rem;
    }

    /* Summary tab */
    .summary-text {
      font-size: 0.9375rem;
      color: var(--text);
      line-height: 1.8;
    }

    /* Key points tab */
    .keypoints-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .keypoints-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
    }

    .kp-bullet {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(232,71,42,0.15);
      border: 1px solid rgba(232,71,42,0.3);
      color: var(--accent);
      font-size: 0.625rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Notes tab */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.875rem 1.125rem;
      border-left: 3px solid var(--accent-2);
    }

    .note-topic {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    .note-content {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.7;
    }

    /* ── CARD FOOTER ──────────────────────────────────────── */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    /* ── FOOTER ───────────────────────────────────────────── */
    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-3);
    }

    footer a { color: var(--text-2); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* ── RESPONSIVE ───────────────────────────────────────── */
    @media (max-width: 520px) {
      .url-row     { flex-direction: column; }
      .btn-primary { justify-content: center; }
      .video-thumb { display: none; }
    }
  </style>
</head>

<script>

// ── STATE ──────────────────────────────────────────────────────────────
let currentMode = 'all';   // currently selected focus chip
let lastResult  = null;    // stores the last parsed Claude response (for copy)

// Focus mode → extra instruction appended to the Claude system prompt
const MODE_INSTRUCTIONS = {
  all:         'Cover all topics comprehensively.',
  technical:   'Focus on technical details, tools, code patterns, and implementation specifics.',
  educational: 'Focus on learning outcomes, key concepts, and takeaways for a student.',
  business:    'Focus on business insights, strategies, market context, and actionable advice.',
};


// ── UTILITY HELPERS ───────────────────────────────────────────────────

/** Show or hide an element by toggling the "visible" class */
function show(id) { document.getElementById(id).classList.add('visible'); }
function hide(id) { document.getElementById(id).classList.remove('visible'); }

/** Update the status bar message */
function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
  show('statusBar');
}

/** Show an error message in the red error box */
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('visible');
}

/** Clear all error / status / result states before a new run */
function resetUI() {
  hide('statusBar');
  hide('errorBox');
  hide('resultCard');
  document.getElementById('errorBox').classList.remove('visible');
}


// ── CHIP (FOCUS MODE) SELECTION ────────────────────────────────────────
function setMode(el) {
  // Remove "active" from all chips, then add to clicked one
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentMode = el.dataset.mode;
}


// ── TAB SWITCHING ──────────────────────────────────────────────────────
function switchTab(name, btn) {
  // Deactivate all tab buttons and panels
  document.querySelectorAll('.tab-btn').forEach(t => {
    t.classList.remove('active');
    t.setAttribute('aria-selected', 'false');
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  // Activate the clicked tab
  btn.classList.add('active');
  btn.setAttribute('aria-selected', 'true');
  document.getElementById('panel-' + name).classList.add('active');
}


// ── VIDEO ID EXTRACTION ────────────────────────────────────────────────
/**
 * Given a YouTube URL (in any common format), returns the 11-char video ID.
 * Handles: youtube.com/watch?v=, youtu.be/, /embed/, /shorts/
 * Returns null if no valid ID found.
 */
function extractVideoId(url) {
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,           // ?v=ID or &v=ID
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,       // youtu.be/ID
    /\/embed\/([a-zA-Z0-9_-]{11})/,         // /embed/ID
    /\/shorts\/([a-zA-Z0-9_-]{11})/,        // /shorts/ID
  ];
  for (const p of patterns) {
    const match = url.match(p);
    if (match) return match[1];
  }
  return null;
}


// ── FETCH VIDEO METADATA (title, author) ──────────────────────────────
/**
 * Uses noembed.com — a free oEmbed proxy — to get the video title and author.
 * No API key needed. Falls back gracefully if it fails.
 */
async function fetchVideoInfo(videoId) {
  try {
    const res = await fetch(
      `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`
    );
    if (res.ok) {
      const data = await res.json();
      return {
        title:  data.title       || 'YouTube Video',
        author: data.author_name || '',
      };
    }
  } catch (err) {
    console.warn('noembed fetch failed:', err);
  }
  return { title: 'YouTube Video', author: '' };
}


// ── FETCH TRANSCRIPT ──────────────────────────────────────────────────
/**
 * Calls the Supadata API to get the plain-text transcript of the video.
 * Supadata extracts YouTube captions/auto-captions and returns them as text.
 *
 * API docs: https://supadata.ai/documentation
 * Free tier: 100 transcript fetches / day
 *
 * Returns the transcript string, or null if unavailable.
 */
async function fetchTranscript(videoId) {
  try {
    const res = await fetch(
      `https://api.supadata.ai/v1/youtube/transcript?videoId=${videoId}&text=true`,
      {
        headers: {
          'x-api-key': CONFIG.SUPADATA_API_KEY,
        },
      }
    );

    if (!res.ok) {
      console.warn('Supadata error:', res.status, await res.text());
      return null;
    }

    const data = await res.json();
    // The API may return the text in different fields depending on the version
    return data.content || data.transcript || data.text || null;

  } catch (err) {
    console.warn('Transcript fetch failed:', err);
    return null;
  }
}


// ── CALL CLAUDE API ───────────────────────────────────────────────────
/**
 * Sends the transcript to the Anthropic Claude API and asks it to return
 * structured JSON with summary, key points, and notes.
 *
 * System prompt engineering:
 *   - We tell Claude to ONLY return JSON (no preamble, no markdown fences)
 *   - We specify the exact JSON shape we expect
 *   - We append mode-specific instructions (technical, educational, etc.)
 *
 * Response parsing:
 *   - We strip any accidental ``` backtick fences just in case
 *   - We JSON.parse the cleaned string
 *
 * IMPORTANT — CORS NOTE:
 *   Anthropic's API does not allow direct browser-to-API calls in production.
 *   For a deployed website you need a backend proxy (see note at bottom of file).
 *   For local testing, use a CORS browser extension or a local proxy.
 */
async function callGoogleAPI(transcript, mode) {
  // Build the system prompt
  const systemPrompt = `You are an expert note-taker and summarizer.
Analyze the following YouTube video transcript and return ONLY a valid JSON object.
Do NOT include any text before or after the JSON. Do NOT wrap it in markdown code blocks.

The JSON must have exactly this structure:
{
  "summary": "A 2-3 sentence overview of the entire video",
  "keypoints": [
    "Key point 1",
    "Key point 2",
    "Key point 3",
    "Key point 4",
    "Key point 5"
  ],
  "notes": [
    { "topic": "Topic Name", "content": "Detailed note about this topic" },
    { "topic": "Topic Name", "content": "Detailed note about this topic" }
  ]
}

Rules:
- Include 5 to 8 key points (short, punchy, actionable sentences)
- Include 4 to 7 note sections (each covering a distinct sub-topic)
- ${MODE_INSTRUCTIONS[mode]}
- Write in clear, plain English`;

  // Truncate transcript to stay within reasonable token limits
  const truncatedTranscript = transcript.slice(0, CONFIG.MAX_TRANSCRIPT_CHARS);

  const response = await fetch(
  `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GOOGLE_MODEL}:generateContent?key=${CONFIG.GOOGLE_API_KEY}`,
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      contents: [
        {
          role: "user",
          parts: [
            {
              text: `${systemPrompt}\n\nHere is the video transcript:\n\n${truncatedTranscript}`
            }
          ]
        }
      ]
    }),
  }
);

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${response.status}`);
  }

  const data = await response.json();
  if (!data.candidates || !data.candidates.length) {
  throw new Error('No response from Gemini API');
}

  // data.content is an array of blocks; text blocks have a .text property
 const rawText =
  data.candidates?.[0]?.content?.parts?.[0]?.text || '';

  // Strip markdown fences if Claude accidentally added them
  const cleaned = rawText.replace(/```json|```/gi, '').trim();

  // Parse and return the JSON object
  return JSON.parse(cleaned);
}


// ── RENDER RESULTS INTO THE DOM ────────────────────────────────────────
function renderResults(result, videoId, info) {
  // Video header
  document.getElementById('thumbImg').src =
    `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
  document.getElementById('videoTitle').textContent  = info.title;
  document.getElementById('videoAuthor').textContent = info.author
    ? `by ${info.author}` : '';

  // Summary tab
  document.getElementById('summaryText').textContent = result.summary;

  // Key points tab — numbered bullets
  const kpList = document.getElementById('keypointsList');
  kpList.innerHTML = '';
  result.keypoints.forEach((point, i) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="kp-bullet" aria-hidden="true">${i + 1}</div>
      <span>${point}</span>
    `;
    kpList.appendChild(li);
  });

  // Notes tab — topic + content cards
  const notesList = document.getElementById('notesList');
  notesList.innerHTML = '';
  result.notes.forEach(note => {
    const div = document.createElement('div');
    div.className = 'note-item';
    div.innerHTML = `
      <div class="note-topic">${note.topic}</div>
      <div class="note-content">${note.content}</div>
    `;
    notesList.appendChild(div);
  });

  // Reset to first tab
  switchTab('summary', document.querySelector('.tab-btn'));

  // Show the card
  show('resultCard');
}


// ── COPY ALL NOTES TO CLIPBOARD ────────────────────────────────────────
function copyAllNotes() {
  if (!lastResult) return;

  // Build a plain-text version of the full output
  const text = [
    '# Summary',
    lastResult.summary,
    '',
    '# Key Points',
    ...lastResult.keypoints.map((p, i) => `${i + 1}. ${p}`),
    '',
    '# Notes',
    ...lastResult.notes.map(n => `## ${n.topic}\n${n.content}`),
  ].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    // Brief "Copied!" feedback on the button
    const btn = document.querySelector('.card-footer .btn-ghost');
    const original = btn.innerHTML;
    btn.innerHTML = '✓ Copied!';
    btn.style.color = '#3ecf8e';
    setTimeout(() => {
      btn.innerHTML = original;
      btn.style.color = '';
    }, 2000);
  });
}


// ── MAIN HANDLER — called when user clicks "Summarize" ─────────────────
async function handleSummarize() {
  const url = document.getElementById('urlInput').value.trim();

  // Basic validation
  if (!url) {
    showError('Please enter a YouTube URL.');
    return;
  }

  const videoId = extractVideoId(url);
  if (!videoId) {
    showError('Could not find a valid YouTube video ID in that URL. Make sure it looks like: https://youtube.com/watch?v=XXXXXXXXXXX');
    return;
  }

  // API key check
  if (CONFIG.GOOGLE_API_KEY === 'YOUR_ANTHROPIC_API_KEY_HERE') {
    showError('Please open the HTML file and set your ANTHROPIC_API_KEY in the CONFIG object at the top of the <script> section.');
    return;
  }

  // Lock UI
  resetUI();
  document.getElementById('summarizeBtn').disabled = true;
  lastResult = null;

  try {
    // STEP 1: Get video title + author
    setStatus('Fetching video information…');
    const info = await fetchVideoInfo(videoId);

    // STEP 2: Get transcript
    setStatus('Fetching transcript…');
    let transcript = await fetchTranscript(videoId);

    // Graceful fallback if transcript is unavailable
    if (!transcript) {
      console.warn('No transcript available — using title-only fallback');
      transcript = `This video is titled "${info.title}" by ${info.author}.
The transcript could not be retrieved (the video may not have captions enabled).
Please summarize based on what can be inferred from the title and any available metadata.`;
    }

    // STEP 3: Call Claude
    setStatus('Generating notes with Google Gemini…');
    const result = await callGoogleAPI(transcript, currentMode);

    // STEP 4: Render
    lastResult = result;
    hide('statusBar');
    renderResults(result, videoId, info);

  } catch (err) {
    hide('statusBar');
    console.error('Summarizer error:', err);
    showError('Something went wrong: ' + (err.message || 'Unknown error. Check the browser console for details.'));
  } finally {
    // Always re-enable the button
    document.getElementById('summarizeBtn').disabled = false;
  }
}


// ── KEYBOARD SHORTCUT — press Enter in the URL input ──────────────────
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSummarize();
});

</script>
